spring.application.name=agencia

# Chave secreta usada para assinar/validar os JWTs. Em um ambiente real NUNCA
# fique com o valor padrao abaixo - configure a variavel de ambiente JWT_SECRET
# com uma string aleatoria longa (pelo menos 32 caracteres).
jwt.secret=${JWT_SECRET:troque-esta-chave-para-algo-secreto-com-mais-de-32-caracteres}

# Tempo de expiracao do token de usuario (15 minutos, em milissegundos).
jwt.expiration-ms=900000

# Tempo de expiracao do token interno usado nas chamadas agencia-a-agencia
# (1 minuto - e usado uma unica vez, no instante da chamada).
jwt.internal-expiration-ms=60000

logging.level.org.springframework.security=WARN
